<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07070a" />
  <meta name="description" content="A premium anime streaming experience powered by AniList." />
  <title>NEBULA — Anime Streaming</title>

  <!-- Tailwind CSS CDN: zero-build static deployment -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            glow: '0 0 80px rgba(139,92,246,.20)',
          }
        }
      }
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>

<body class="bg-[#07070a] text-white antialiased selection:bg-violet-500/40">
  <div id="app"></div>

  <!-- Search overlay -->
  <div id="searchOverlay" class="overlay hidden" aria-hidden="true">
    <div class="overlay-backdrop" data-close-overlay></div>
    <section class="search-modal glass-panel" role="dialog" aria-modal="true" aria-label="Search anime">
      <div class="flex items-center gap-3 border-b border-white/10 px-5 py-4">
        <svg class="h-5 w-5 text-white/45" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" autocomplete="off" placeholder="Search anime, characters, genres..." class="search-input" />
        <kbd class="kbd">ESC</kbd>
      </div>
      <div id="searchResults" class="max-h-[72vh] overflow-y-auto p-4"></div>
    </section>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="./app.js"></script>
</body>
</html>
